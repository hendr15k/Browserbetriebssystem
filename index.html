<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebOS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="desktop">
        <!-- Desktop Icons -->
        <div class="icon" onclick="openApp('terminal')">
            <div class="icon-img" style="background-color: #333; color: white;">&gt;_</div>
            <div class="icon-label">Terminal</div>
        </div>
        <div class="icon" onclick="openApp('notepad')">
            <div class="icon-img" style="background-color: #fff; color: black; border: 1px solid #ccc;">Txt</div>
            <div class="icon-label">Notepad</div>
        </div>
        <div class="icon" onclick="openApp('file-explorer')">
            <div class="icon-img" style="background-color: #f1c40f; color: white; font-size: 24px;">📂</div>
            <div class="icon-label">Explorer</div>
        </div>
        <div class="icon" onclick="openApp('about')">
            <div class="icon-img" style="background-color: #0078d7; color: white;">?</div>
            <div class="icon-label">About</div>
        </div>
        <div class="icon" onclick="openApp('calculator')">
            <div class="icon-img" style="background-color: #27ae60; color: white;">+ -</div>
            <div class="icon-label">Calculator</div>
        </div>
        <div class="icon" onclick="openApp('snake')">
            <div class="icon-img" style="background-color: #9b59b6; color: white;">S</div>
            <div class="icon-label">Snake</div>
        </div>
        <div class="icon" onclick="openApp('paint')">
            <div class="icon-img" style="background-color: #e67e22; color: white;">P</div>
            <div class="icon-label">Paint</div>
        </div>
        <div class="icon" onclick="openApp('tictactoe')">
            <div class="icon-img" style="background-color: #e74c3c; color: white;">#</div>
            <div class="icon-label">Tic Tac Toe</div>
        </div>
        <div class="icon" onclick="openApp('settings')">
            <div class="icon-img" style="background-color: #777; color: white;">⚙</div>
            <div class="icon-label">Settings</div>
        </div>
        <div class="icon" onclick="openApp('speak')">
            <div class="icon-img" style="background-color: #e91e63; color: white;">🔊</div>
            <div class="icon-label">Speak</div>
        </div>
    </div>

    <div id="start-menu">
        <div class="start-item" onclick="openApp('terminal'); toggleStartMenu()">
            <div class="start-icon" style="background: #333; color: white;">&gt;_</div>
            <span>Terminal</span>
        </div>
        <div class="start-item" onclick="openApp('notepad'); toggleStartMenu()">
            <div class="start-icon" style="background: white; color: black; border: 1px solid #ccc;">Txt</div>
            <span>Notepad</span>
        </div>
        <div class="start-item" onclick="openApp('file-explorer'); toggleStartMenu()">
            <div class="start-icon" style="background: #f1c40f; color: white;">📂</div>
            <span>Explorer</span>
        </div>
        <div class="start-item" onclick="openApp('calculator'); toggleStartMenu()">
            <div class="start-icon" style="background: #27ae60; color: white;">=</div>
            <span>Calculator</span>
        </div>
        <div class="start-item" onclick="openApp('snake'); toggleStartMenu()">
            <div class="start-icon" style="background: #9b59b6; color: white;">S</div>
            <span>Snake</span>
        </div>
        <div class="start-item" onclick="openApp('paint'); toggleStartMenu()">
            <div class="start-icon" style="background: #e67e22; color: white;">P</div>
            <span>Paint</span>
        </div>
        <div class="start-item" onclick="openApp('tictactoe'); toggleStartMenu()">
            <div class="start-icon" style="background: #e74c3c; color: white;">#</div>
            <span>Tic Tac Toe</span>
        </div>
        <div class="start-item" onclick="openApp('settings'); toggleStartMenu()">
            <div class="start-icon" style="background: #777; color: white;">⚙</div>
            <span>Settings</span>
        </div>
        <div class="start-item" onclick="openApp('about'); toggleStartMenu()">
            <div class="start-icon" style="background: #0078d7; color: white;">?</div>
            <span>About</span>
        </div>
        <div class="start-item" onclick="openApp('speak'); toggleStartMenu()">
            <div class="start-icon" style="background: #e91e63; color: white;">🔊</div>
            <span>Speak</span>
        </div>
        <div class="start-divider"></div>
        <div class="start-item" onclick="location.reload()">
            <div class="start-icon" style="background: #e81123; color: white;">R</div>
            <span>Restart</span>
        </div>
    </div>

    <div id="taskbar">
        <button id="start-button" onclick="toggleStartMenu()">Start</button>
        <div id="taskbar-apps"></div>
        <div id="clock">00:00</div>
    </div>

    <!-- Application Templates (Hidden by default, cloned when opened) -->
    <!-- I'll add these in a later step, or maybe the plan step 4 says "Add HTML structure",
         but it might be easier to have a container for windows here. -->
    <div id="window-area"></div>

    <script src="script.js"></script>
</body>
</html>
