<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebOS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="desktop">
        <!-- Desktop Icons - dynamically generated from appData -->
        <div id="desktop-icons"></div>
    </div>

    <div id="start-menu">
        <div class="start-menu-inner">
            <div class="start-sidebar">
                <div class="start-profile">
                    <div class="start-profile-avatar">U</div>
                    <div class="start-profile-info">
                        <div class="start-profile-name">User</div>
                        <div class="start-profile-host">webos-machine</div>
                    </div>
                </div>
                <nav class="start-nav">
                    <button class="start-nav-item active" data-category="all" onclick="switchStartCategory('all')">
                        <span class="start-nav-icon">⊞</span>
                        <span>All Apps</span>
                    </button>
                    <button class="start-nav-item" data-category="system" onclick="switchStartCategory('system')">
                        <span class="start-nav-icon">🖥️</span>
                        <span>System</span>
                    </button>
                    <button class="start-nav-item" data-category="productivity" onclick="switchStartCategory('productivity')">
                        <span class="start-nav-icon">💼</span>
                        <span>Productivity</span>
                    </button>
                    <button class="start-nav-item" data-category="games" onclick="switchStartCategory('games')">
                        <span class="start-nav-icon">🎮</span>
                        <span>Games</span>
                    </button>
                    <button class="start-nav-item" data-category="creative" onclick="switchStartCategory('creative')">
                        <span class="start-nav-icon">🎨</span>
                        <span>Creative</span>
                    </button>
                    <button class="start-nav-item" data-category="internet" onclick="switchStartCategory('internet')">
                        <span class="start-nav-icon">📡</span>
                        <span>Internet</span>
                    </button>
                </nav>
                <div class="start-sidebar-footer">
                    <button class="start-sidebar-btn" onclick="openApp('settings'); toggleStartMenu()">
                        <span>⚙</span> Settings
                    </button>
                    <button class="start-sidebar-btn" onclick="location.reload()">
                        <span>⏻</span> Shut down
                    </button>
                </div>
            </div>
            <div class="start-content">
                <div class="start-search-container">
                    <input type="text" id="start-search" placeholder="Type to search apps..." autocomplete="off">
                    <span class="start-search-icon">🔍</span>
                </div>
                <div id="start-search-count"></div>
                <div id="start-no-results">No apps found.</div>
                <div class="start-apps-grid" id="start-apps-container">
                    <!-- Apps will be populated by JavaScript based on category -->
                </div>
            </div>
        </div>
    </div>

    <div id="taskbar">
        <button id="start-button" onclick="toggleStartMenu()">Start</button>
        <div id="taskbar-apps"></div>
        <button id="power-button" onclick="togglePowerMenu()" title="Power">⏻</button>
        <div id="power-menu">
            <button onclick="lockSystem()">🔒 Sperren</button>
            <button onclick="restartSystem()">🔄 Neustarten</button>
            <button onclick="shutdownSystem()">⏻ Herunterfahren</button>
        </div>
        <div id="clock" onclick="openApp('clock')">00:00</div>
        <button id="show-desktop" onclick="toggleDesktop()" title="Show Desktop">┃</button>
    </div>

    <div id="lock-screen" class="hidden">
        <div class="lock-card">
            <div id="lock-time">00:00</div>
            <div id="lock-date"></div>
            <p>System gesperrt</p>
            <input id="unlock-pin" type="password" placeholder="PIN (Standard: 1234)">
            <button onclick="unlockSystem()">Entsperren</button>
            <div id="lock-error"></div>
        </div>
    </div>

    <!-- Application Templates (Hidden by default, cloned when opened) -->
    <!-- I'll add these in a later step, or maybe the plan step 4 says "Add HTML structure",
         but it might be easier to have a container for windows here. -->
    <div id="window-area"></div>

    <div id="notification-area"></div>

    <script src="notifications.js"></script>
    <script src="script.js"></script>
</body>
</html>
